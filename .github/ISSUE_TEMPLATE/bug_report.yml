name: Bug report
description: Something in Callout Bullets doesn't work the way it should
labels: ['bug']
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to file a report.

        Callout Bullets is a fork of
        [obsidian-list-callouts](https://github.com/mgmeyers/obsidian-list-callouts).
        If you're running the original plugin rather than this one, please report it
        there instead — the two are separate plugins and don't share any state.

  - type: checkboxes
    id: checks
    attributes:
      label: Before reporting
      options:
        - label: I searched the existing issues and didn't find this one.
          required: true
        - label: I'm running the **Callout Bullets** plugin, not the original List Callouts.
          required: true

  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What did you see? What did you expect to see instead?
      placeholder: Typing `&` at the start of a list item leaves the character visible instead of turning it into a callout.
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: |
        The smallest sequence that reproduces it. If the problem depends on
        particular markdown, paste the note's source rather than a screenshot of it.
      value: |
        1.
        2.
        3.
    validations:
      required: true

  - type: input
    id: plugin-version
    attributes:
      label: Callout Bullets version
      description: Settings → Community plugins → Callout Bullets
      placeholder: 1.2.9
    validations:
      required: true

  - type: input
    id: obsidian-version
    attributes:
      label: Obsidian version
      description: |
        Help → Show debug info. Please include both the Obsidian and installer
        versions if they differ.
      placeholder: v1.13.7 (installer v1.13.7)
    validations:
      required: true

  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - Desktop — Linux
        - Desktop — macOS
        - Desktop — Windows
        - Mobile — iOS / iPadOS
        - Mobile — Android
    validations:
      required: true

  - type: checkboxes
    id: isolated
    attributes:
      label: Isolation
      description: |
        Optional, but it saves a round trip. Themes and other plugins — Style
        Settings and Iconize especially — can change how callouts render.
      options:
        - label: Still happens with other community plugins disabled.
        - label: Still happens with the default theme.

  - type: textarea
    id: console
    attributes:
      label: Console output
      description: |
        Any errors from the developer console (Ctrl/Cmd + Shift + I → Console).
        This is automatically formatted as code, so no backticks needed.
      render: text

  - type: textarea
    id: context
    attributes:
      label: Anything else
      description: Screenshots, custom callout configuration, custom icons — whatever seems relevant.
